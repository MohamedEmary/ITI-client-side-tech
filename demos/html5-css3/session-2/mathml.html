<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<!-- 
    mi -> identifiers (x,y,...)
    mn -> numbers
    mo -> operators
    mfrac -> fractions
    msqrt -> square root
    msub, msup -> subscript and superscript
    -->
		<!-- mathml -->
		<!-- 1/3 -->
		<math>
			<mfrac>
				<mrow>
					<mfrac>
						<mrow>
							<mn>1</mn>
						</mrow>
						<mrow>
							<mn>2</mn>
						</mrow>
					</mfrac>
				</mrow>
				<mrow
					><mfrac><mn>1</mn> <mn>3</mn></mfrac></mrow
				>
			</mfrac>
		</math>

		<!-- e=mc2 -->
		<!-- subscript & superscript -->
		<br />
		<math>
			<mi>e</mi>
			<mo>=</mo>
			<mi>m</mi>
			<msup>
				<mi>c</mi>
				<mn>2</mn>
			</msup>
			<msub>
				<mi>c</mi>
				<mn>2</mn>
			</msub>
		</math>

		<!-- summation -->
		<br />
		<br />
		<math>
			<munderover>
				<mo>&sum;</mo>
				<mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow>
				<mrow><mn>&infin;</mn></mrow>
			</munderover>
			<mi>x</mi><mo>+</mo><mn>2</mn>
		</math>
		<!-- MathJax LaTeX-->

		<math xmlns="http://www.w3.org/1998/Math/MathML"
			><mfrac
				><mn>2</mn
				><mrow
					><mn>3</mn
					><msqrt
						><mrow><mn>4</mn><mi>x</mi></mrow></msqrt
					></mrow
				></mfrac
			><mo>&#xd7;</mo
			><mfrac
				><mrow
					><munderover accent="false" accentunder="false"
						><mo>&#x2211;</mo><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow
						><mi>&#x221e;</mi></munderover
					><mi>x</mi><mo>+</mo><mn>2</mn></mrow
				><mn>4</mn></mfrac
			></math
		>
	</body>
</html>
